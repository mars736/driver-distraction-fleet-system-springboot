spring:
  application:
    name: driver-distraction-fleet-system-springboot
  datasource: #todo：后面再去配置，新建一个数据库，名字叫 driver_fleet
    url: jdbc:mysql://localhost:3306/driver_fleet?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

infer:
  batch-size: 20
  batch-timeout-ms: 100
  queue-capacity: 1024
  fastapi-url: http://127.0.0.1:8000/predict

driver-safety-rating:
  enabled: ${DRIVER_SAFETY_RATING_ENABLED:false}

transport-orders:
  high-minimum-rating: ${TRANSPORT_ORDER_HIGH_MINIMUM_RATING:A}

video:
  ffmpeg-path: ffmpeg
  evidence:
    enabled: ${VIDEO_EVIDENCE_ENABLED:false}

alert:
  archive:
    enabled: ${ALERT_ARCHIVE_ENABLED:false}

sms:
  mode: ${FLEET_SMS_MODE:simulated}
  aliyun:
    access-key-id: ${FLEET_SMS_ACCESS_KEY_ID:}
    access-key-secret: ${FLEET_SMS_ACCESS_KEY_SECRET:}
    sign-name: ${FLEET_SMS_SIGN_NAME:}
    template-code: ${FLEET_SMS_TEMPLATE_CODE:}
    out-id-prefix: ${FLEET_SMS_OUT_ID_PREFIX:}
    behavior-parameter: ${FLEET_SMS_BEHAVIOR_PARAMETER:}
    alert-id-parameter: ${FLEET_SMS_ALERT_ID_PARAMETER:}

# JWT 密钥与有效期（HS256 要求密钥 >= 32 字节；演示用，上线前替换）
jwt:
  secret: driver-distraction-fleet-system-default-secret-key-1234567890
  expire-ms: 7200000

# M0 新增：本地上传目录，WebConfig 把它映射到 /upload/**
file:
  upload-dir: ./upload
